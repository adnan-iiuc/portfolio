<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white">
    <!-- Projects Section -->
<section class="py-20 border-t border-slate-800">

    <div class="max-w-6xl mx-auto px-6">

        <!-- Section Title -->
        <div class="text-center mb-12">

            <p class="text-emerald-400 text-sm font-semibold">
                MY PROJECTS
            </p>

            <h2 class="text-3xl md:text-4xl font-bold mt-2">
                Projects I Have Worked On
            </h2>

            <p class="text-slate-400 mt-4 max-w-2xl mx-auto">
                Some of the projects I have created while learning
                and practicing web development.
            </p>

        </div>


        <!-- Add Project Form -->
        <div class="max-w-xl mx-auto mb-10">

            <div class="flex gap-3">

                <input
                    id="projectInput"
                    type="text"
                    placeholder="Enter a project"
                    class="flex-1 rounded-lg bg-slate-900
                           border border-slate-700 px-4 py-3
                           outline-none
                           focus:border-emerald-400">

                <button
                    id="addProjectBtn"
                    class="rounded-lg bg-emerald-400
                           px-5 py-3 font-semibold
                           text-slate-950
                           hover:bg-emerald-300">

                    Add Project

                </button>

            </div>

        </div>


        <!-- Projects Container -->
        <div id="projectsContainer"
             class="grid md:grid-cols-2 gap-6">

        </div>

    </div>

</section>
<script src="project.js"></script>
</body>
</html>
